name: Build KYMAK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair codigo
        run: |
          mkdir kymak
          unzip -q kymak-src.zip -d kymak
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - name: Compilar APK (rapido, otimizado)
        working-directory: kymak
        run: gradle assembleArm64Release --no-daemon --stacktrace || gradle assembleArm64Debug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KYMAK-apk
          path: |
            kymak/app/build/outputs/apk/arm64/release/*.apk
            kymak/app/build/outputs/apk/arm64/debug/*.apk
